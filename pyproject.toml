[project]
name = "homebase-cli"
version = "0.1.0"
description = "A command-line workspace manager for organizing files and todos by context."
readme = "README.md"
authors = [
    { name = "Sunny Sun", email = "chs019@ucsd.edu" }
]
requires-python = ">=3.8"
dependencies = [
    "rich>=13.7.0",
    "typer>=0.9.0",
]

[project.scripts]
hb = "homebase.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homebase"]
